name: Update Dependencies

on:
  schedule:
    - cron: "0 8 * * 1" # Weekly on Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-for-updates:
    runs-on: ubuntu-latest
    outputs:
      is-update-available: ${{ steps.check-for-updates.outputs.is-update-available }}
      new-tags: ${{ steps.check-for-updates.outputs.new-tags }}
    steps:
      - name: Check for Mathlib updates
        id: check-for-updates
        uses: leanprover-community/mathlib-update-action@d2813fb906f1f47c9e3bee0345f199fd404fefdf # v1
        # START CONFIGURATION BLOCK 1
        # END CONFIGURATION BLOCK 1

  do-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    needs: check-for-updates
    if: ${{ needs.check-for-updates.outputs.is-update-available == 'true' }}
    strategy:
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.check-for-updates.outputs.new-tags) }}
    steps:
      - name: Apply Mathlib update
        id: update-the-repo
        uses: leanprover-community/mathlib-update-action/do-update@d2813fb906f1f47c9e3bee0345f199fd404fefdf # v1
        with:
          tag: ${{ matrix.tag }}
          # START CONFIGURATION BLOCK 2
          on_update_succeeds: pr
          on_update_fails: issue
          # END CONFIGURATION BLOCK 2
