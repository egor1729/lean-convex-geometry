name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - lean-toolchain

permissions:
  contents: write

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    steps:
      - name: lean-release-tag action
        uses: leanprover-community/lean-release-tag@9ca7ed09e240259871327bfc3a3a8d8c4bcb41aa # v1
        with:
          do-release: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
