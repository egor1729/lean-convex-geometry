name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean-build:
    name: Lean 4 Build & Axiom Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build ConvexGeom (fail on warnings)
        run: lake build ConvexGeom --wfail
      - name: Run Axiom Audit
        run: |
          set -euo pipefail
          out="$(lake env lean ConvexGeom/Verification/AxiomAudit.lean 2>&1)"
          echo "$out"
          python3 - "$out" <<'PY'
          import re, sys
          text = sys.argv[1]
          forbidden = ("sorryAx", "Lean.ofReduceBool", "Lean.trustCompiler")
          for tok in forbidden:
              if tok in text:
                  print(f"ERROR: Forbidden axiom detected: {tok}")
                  sys.exit(1)
          entries = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text, re.S)
          if not entries:
              print("ERROR: AxiomAudit produced no axiom reports!")
              sys.exit(1)
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          bad = []
          for name, axs in entries:
              parsed = [a.strip() for a in axs.split(",") if a.strip()]
              unexpected = [a for a in parsed if a not in allowed]
              if unexpected:
                  bad.append((name, unexpected))
          if bad:
              print("ERROR: Unexpected axiom(s) detected:")
              for name, unexpected in bad:
                  print(f"  {name}: {unexpected}")
              sys.exit(1)
          print(f"Axiom audit passed ({len(entries)} theorems verified).")
          PY
