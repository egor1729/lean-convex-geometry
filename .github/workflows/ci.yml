name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  metadata:
    name: Metadata & Schema Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate formalization.yaml, comparator.json, and CITATION.cff
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml==6.0.2 jsonschema==4.23.0

          FORM_SCHEMA_SHA="99c678e569c7c4c0772db297c5ddd5e4c9b6322e"
          FORM_SCHEMA_SHA256="25ff6b25ca4511635aff4443cf20480c15e59dddf19591c730950b442ea54fce"
          curl -sSfL \
            "https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/${FORM_SCHEMA_SHA}/schema/v0.4.schema.json" \
            -o /tmp/v0.4.schema.json
          echo "${FORM_SCHEMA_SHA256}  /tmp/v0.4.schema.json" | sha256sum -c -
          python3 scripts/validate-formalization.py --schema /tmp/v0.4.schema.json

          CFF_SCHEMA_SHA="396f738fb025b1d8acdb02a56ffc923f95dc8999"
          CFF_SCHEMA_SHA256="0b8d22140da702d766df318dcff3a91af2f39521298dcf36d76315fd99cc169b"
          curl -sSfL \
            "https://raw.githubusercontent.com/citation-file-format/citation-file-format/${CFF_SCHEMA_SHA}/schema.json" \
            -o /tmp/cff-1.2.0.schema.json
          echo "${CFF_SCHEMA_SHA256}  /tmp/cff-1.2.0.schema.json" | sha256sum -c -
          python3 -c '
          import json, pathlib, yaml, jsonschema
          doc = yaml.safe_load(pathlib.Path("CITATION.cff").read_text(encoding="utf-8"))
          schema = json.loads(pathlib.Path("/tmp/cff-1.2.0.schema.json").read_text(encoding="utf-8"))
          jsonschema.validate(instance=doc, schema=schema)
          print("CITATION.cff validation PASSED.")
          '

  build:
    name: Lean Build, Test, Lint & Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, test, lint, mk_all, and axiom-audit
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          build-args: "--wfail"
          test: true
          lint: true
          mk_all-check: true
          mk_all-args: "--lib ConvexGeom"
          axiom-audit: true
          axiom-audit-root: "ConvexGeom"

      - name: Build Solution with --wfail
        run: lake build Solution --wfail

      - name: Replay every library module and Solution through leanchecker
        # Run leanchecker per leaf module to avoid a Lean v4.36.0 SIGSEGV when
        # replaying multiple modules in one leanchecker process.
        run: |
          set -euo pipefail
          for f in $(find ConvexGeom/* -name '*.lean' | sort); do
            mod="${f%.lean}"
            mod="${mod//\//.}"
            echo "leanchecker: $mod"
            lake env leanchecker "$mod"
          done
          echo "leanchecker: Solution"
          lake env leanchecker Solution

  comparator:
    name: Sandboxed Comparator & Independent Kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned elan (SHA-256 verified)
        run: |
          set -euo pipefail
          ELAN_VERSION="v4.4.0"
          ELAN_SHA256="0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2"
          curl -sSfL "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/elan.tar.gz
          echo "${ELAN_SHA256}  /tmp/elan.tar.gz" | sha256sum -c -
          mkdir -p /tmp/elan-unpack
          tar -xzf /tmp/elan.tar.gz -C /tmp/elan-unpack
          /tmp/elan-unpack/elan-init -y --default-toolchain none
          rm -rf /tmp/elan.tar.gz /tmp/elan-unpack
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install bubblewrap for lake comparator sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor;
        # the CI runner is disposable.
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run sandboxed lake comparator (Lean + nanoda + con-ron)
        run: bash scripts/verify-comparator.sh
