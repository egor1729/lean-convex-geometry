      lean: "ConvexGeom.blaschke_selection"
      module: "ConvexGeom.Metric.Blaschke"
      status: "proved"
    - source: "Bipolar Theorem (Schneider §1.6)"
      lean: "ConvexGeom.polarBody_polarBody"
      module: "ConvexGeom.Metric.Polarity"
      status: "proved"
    - source: "Supporting Hyperplane Theorem (Schneider §1.3)"
      lean: "ConvexGeom.exists_supporting_normal_of_mem_frontier"
      module: "ConvexGeom.Metric.Projection"
      status: "proved"
    - source: "d-Simplex Volume Formula"
      lean: "ConvexGeom.volume_convexHull_simplex_matrix"
