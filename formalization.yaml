automation:
  methods:
    - method: "agent"
      models:
        - "Gemini 4 Neon"
      framework: "Antigravity"
      tool_setup: >-
        Interactive coding agent running across several sessions in Antigravity
        with direct Lean 4 compiler (--wfail), lake test, lake lint,
        leanchecker, axiom-audit, and lake comparator feedback under human
        maintainer direction.
      cost:
        wall_time: "~1 week across several runs"
        spend_usd: "Pro subscription"
        hardware: "Cloud VM (Antigravity)"
    - method: "agent"
      models:
        - "Claude Opus 5.5"
      framework: "Claude Code"
      tool_setup: >-
        Used for independent code, mathematical statement, and verification
        review only (not proof generation).
  spend_usd: "Pro subscription"
  notes: >-
    Formalization and proof engineering are carried out with Gemini 4 Neon in
    Antigravity under the responsible maintainer's direction across several
    sessions (~1 week of work so far), with Claude Opus 5.5 in Claude Code used
    exclusively for independent review. All claims are machine-checked by Lean
    4.36.0, leanchecker, leanprover-community/axiom-audit, and sandboxed lake
    comparator with bundled independent external kernels.

fidelity:
  divergences: >-
    Conventions, scope limits, and proof-route adaptations are recorded in
    detail in docs/CONVENTIONS.md. Key points:
    (1) ConvexBody E follows Mathlib and includes empty-interior compact convex
    sets, so theorems requiring nonempty interior or 0 in interior K state that
    hypothesis explicitly.
    (2) minkowskiSurfaceArea is defined as the lower outer Minkowski content
    liminf_{t -> 0+} (vol(K + t B_1) - vol(K)) / t rather than geometric
    measure theory perimeter or hausdorffMeasure; its equality with (d-1)-dim
    Hausdorff measure on full-dimensional convex bodies is not formalized, and
    it differs by a factor of 2 on (d-1)-dimensional degenerate convex bodies.
    (3) meanWidth K = integral_{S^{d-1}} h_K(u) d sigma(u) is half the
    classical mean breadth (so meanWidth(B(c, r)) = r). Uniqueness of
    sphereProb under O(E) and equality with normalized Hausdorff surface
    measure are not formalized.
    (4) Brascamp-Lieb and reverse Brascamp-Lieb are formalized in the rank-1
    geometric (John decomposition) form via Barthe's 1D monotone Gaussian
    transport. Forward brascamp_lieb_rankOne holds for arbitrary measurable
    ENNReal functions, while reverse_brascamp_lieb_rankOne requires each f i to
    be continuous, strictly positive, and integrable on a nonempty open
    interval I i.
    (5) Fritz John's theorem formalizes existence of the maximal-volume
    inscribed ellipsoid, John position, and the necessary ("only if")
    contact-point decomposition; uniqueness of the maximal ellipsoid, the
    converse (decomposition implies maximality), and explicit enclosing
    minimality in loewner_theorem_symmetric are not yet formalized.
    (6) Gaussian and spherical Lipschitz concentration are derived from
    Prekopa-Leindler and radial Gaussian-to-sphere projection rather than
    Gaussian/Levy isoperimetry, yielding explicit non-optimal constants
    (e.g. 576 in spherical concentration, 16 in Johnson-Lindenstrauss, and
    8192 * k * log(48/eps) <= eps^2 * log d in Dvoretzky's theorem).
    (7) Blaschke-Santalo is proved via Meyer-Pajor (1990) slice symmetrization
    and strict decrease of the second moment under directional Steiner
    symmetrization, with Urysohn's inequality derived as a corollary.
    (8) Equality characterizations (Brunn-Minkowski homothety, isoperimetric
    balls, Blaschke-Santalo ellipsoids) are not yet formalized.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (Claude Code, review only)"
  notes: >-
    Automated CI runs leanprover/lean-action (lake build --wfail, lake test on
    ConvexGeomTest, lake lint via Batteries runLinter, mk_all --check,
    leanprover-community/axiom-audit, and leanchecker), schema validation of
    formalization.yaml and CITATION.cff, and sandboxed lake comparator
    statement matching against Mathlib-only Challenge.lean with bundled
    independent kernels (nanoda_bin, con-ron, and optional --paranoid
    all-5-kernel replay). Independent statement and code review is performed
    using Claude Opus 5.5 in Claude Code under maintainer Yegor Gorodzha.

alignment:
  namespace: "ConvexGeom"
  statements:
    - source: "Blaschke Selection Theorem (Schneider §1.8)"
      lean: "ConvexGeom.blaschke_selection"
      module: "ConvexGeom.Metric.Blaschke"
      status: "proved"
    - source: "Bipolar Theorem (Schneider §1.6)"
      lean: "ConvexGeom.polarBody_polarBody"
      module: "ConvexGeom.Metric.Polarity"
      status: "proved"
    - source: "Supporting Hyperplane Theorem (Schneider §1.3)"
      lean: "ConvexGeom.exists_supporting_normal_of_mem_frontier"
      module: "ConvexGeom.Metric.Projection"
      status: "proved"
    - source: "d-Simplex Volume Formula"
      lean: "ConvexGeom.volume_convexHull_simplex_matrix"
      module: "ConvexGeom.Polytope.SimplexVolume"
      status: "proved"
    - source: "Helly's Theorem (Gruber Ch. 3)"
      lean: "ConvexGeom.helly_convexBody_finset"
      module: "ConvexGeom.Polytope.Combinatorial"
      status: "proved"
      note: "Thin ConvexBody wrapper around Mathlib's Convex.helly_theorem_finset."
    - source: "Minkowski-Caratheodory Theorem (Gruber Ch. 5)"
      lean: "ConvexGeom.convexHull_extremePoints_eq"
      module: "ConvexGeom.Polytope.Combinatorial"
      status: "proved"
    - source: "Jung's Circumradius Theorem (Gruber Ch. 11)"
      lean: "ConvexGeom.jung_circumradius_convexBody"
      module: "ConvexGeom.Polytope.Combinatorial"
      status: "proved"
    - source: "Weyl-Minkowski V->H Duality (Gruber Ch. 15)"
      lean: "ConvexGeom.weyl_minkowski_halfspaces"
      module: "ConvexGeom.Polytope.Faces"
      status: "proved"
    - source: "Prekopa-Leindler Inequality (Ball Lec. 1)"
      lean: "ConvexGeom.prekopa_leindler"
      module: "ConvexGeom.Volume.BrunnMinkowski"
      status: "proved"
    - source: "Brunn-Minkowski Inequality (Ball Lec. 1)"
      lean: "ConvexGeom.brunn_minkowski_compact"
      module: "ConvexGeom.Volume.BrunnMinkowski"
      status: "proved"
      note: "Inequality only; homothety equality case not yet formalized."
    - source: "Isodiametric Inequality (Ball Lec. 1)"
      lean: "ConvexGeom.isodiametric_inequality"
      module: "ConvexGeom.Volume.BrunnMinkowski"
      status: "proved"
    - source: "Rogers-Shephard Inequality (Schneider §10.1)"
      lean: "ConvexGeom.rogers_shephard"
      module: "ConvexGeom.Volume.BrunnConcavity"
      status: "proved"
    - source: "Euclidean Isoperimetric Inequality (Ball Lec. 1)"
      lean: "ConvexGeom.isoperimetric_inequality"
      module: "ConvexGeom.Volume.Isoperimetric"
      status: "proved"
      note: "Stated for lower outer Minkowski content; equality characterization not yet formalized."
    - source: "Fritz John's Theorem, general & symmetric (Ball Lec. 3)"
      lean: "ConvexGeom.john_theorem"
      module: "ConvexGeom.Asymptotic.JohnEllipsoid"
      status: "partial"
      note: "Existence of maximal inscribed ellipsoid, John position, sandwich bounds, and necessary contact-point decomposition proved; uniqueness and converse not yet formalized."
    - source: "Dvoretzky-Rogers Lemma & Banach-Mazur Compactum (Ball Lec. 4)"
      lean: "ConvexGeom.dvoretzky_rogers_lemma"
      module: "ConvexGeom.Asymptotic.JohnEllipsoid"
      status: "proved"
    - source: "Loomis-Whitney Inequality (Ball Lec. 6)"
      lean: "ConvexGeom.loomis_whitney"
      module: "ConvexGeom.Asymptotic.BrascampLieb"
      status: "proved"
    - source: "Rank-1 Geometric Brascamp-Lieb Inequality (Ball Lec. 6; Barthe 1998)"
      lean: "ConvexGeom.brascamp_lieb_rankOne"
      module: "ConvexGeom.Asymptotic.BrascampLieb"
      status: "proved"
    - source: "Reverse Brascamp-Lieb Inequality (Barthe 1998)"
      lean: "ConvexGeom.reverse_brascamp_lieb_rankOne"
      module: "ConvexGeom.Asymptotic.BrascampLieb"
      status: "partial"
      note: "Rank-1 geometric form for continuous, strictly positive, integrable functions on nonempty open intervals."
    - source: "Ball's Volume Ratio & Reverse Isoperimetric Inequalities (Ball Lec. 6)"
      lean: "ConvexGeom.ball_reverse_isoperimetric"
      module: "ConvexGeom.Asymptotic.BrascampLieb"
      status: "proved"
    - source: "Gaussian Width Proportionality & Concentration (Ball Lec. 7-8)"
      lean: "ConvexGeom.gaussian_lipschitz_concentration_mean"
      module: "ConvexGeom.Asymptotic.GaussianConcentration"
      status: "proved"
    - source: "Spherical Concentration for Lipschitz Functions (Ball Lec. 7-8)"
      lean: "ConvexGeom.spherical_lipschitz_concentration_median"
      module: "ConvexGeom.Asymptotic.GaussianConcentration"
      status: "proved"
    - source: "Johnson-Lindenstrauss Lemma (Ball Lec. 8)"
      lean: "ConvexGeom.johnson_lindenstrauss"
      module: "ConvexGeom.Asymptotic.GaussianConcentration"
      status: "proved"
    - source: "Dvoretzky's Theorem (Ball Lec. 9)"
      lean: "ConvexGeom.dvoretzky_theorem"
      module: "ConvexGeom.Asymptotic.GaussianConcentration"
      status: "proved"
    - source: "Blaschke-Santalo Inequality (Meyer-Pajor 1990; AGM Ch. 1)"
      lean: "ConvexGeom.blaschke_santalo"
      module: "ConvexGeom.Asymptotic.BlaschkeSantalo"
      status: "proved"
      note: "Inequality only; ellipsoid equality case not yet formalized."
    - source: "Dual Urysohn & Urysohn Inequalities (AGM Ch. 1)"
      lean: "ConvexGeom.urysohn_inequality"
      module: "ConvexGeom.Asymptotic.BlaschkeSantalo"
      status: "proved"

