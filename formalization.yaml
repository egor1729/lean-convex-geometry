automation:
  methods:
    - method: "agent"
      models:
        - "Gemini 4 Neon"
      framework: "Antigravity"
      tool_setup: >-
        Interactive coding agent running across several sessions in Antigravity
        with direct Lean 4 compiler (--wfail), convexgeom-audit, and lake
        comparator feedback under human maintainer direction.
      cost:
        wall_time: "~1 week across several runs"
        spend_usd: "Pro subscription"
        hardware: "Cloud VM (Antigravity)"
    - method: "agent"
      models:
        - "Claude Opus 5.5"
      framework: "Claude Code"
      tool_setup: >-
        Used for independent code, mathematical statement, and verification
        review only (not proof generation).
  spend_usd: "Pro subscription"
  notes: >-
    Formalization and proof engineering are carried out with Gemini 4 Neon in
    Antigravity under the responsible maintainer's direction across several
    sessions (~1 week of work so far), with Claude Opus 5.5 in Claude Code used
    exclusively for independent review. All claims are machine-checked by Lean
    4.36.0, convexgeom-audit, and sandboxed lake comparator with bundled
    independent external kernels.

fidelity:
  divergences: >-
    Deliberate conventions, scope decisions, and proof-route adaptations are
    recorded in detail in docs/CONVENTIONS.md. Key points:
    (1) ConvexBody E follows Mathlib and includes empty-interior compact convex
    sets, so theorems requiring nonempty interior or 0 in interior K state that
    hypothesis explicitly.
    (2) minkowskiSurfaceArea is defined as the lower outer Minkowski content
    liminf_{t -> 0+} (vol(K + t B_1) - vol(K)) / t rather than geometric
    measure theory perimeter.
    (3) meanWidth K = integral_{S^{d-1}} h_K(u) d sigma(u) is half the
    classical mean breadth (so meanWidth(B(c, r)) = r).
    (4) Brascamp-Lieb and reverse Brascamp-Lieb are formalized in the rank-1
    geometric (John decomposition) form via Barthe's 1D monotone Gaussian
    transport, which suffices for all Ball volume-ratio and reverse
    isoperimetric applications.
    (5) Gaussian and spherical Lipschitz concentration are derived from
    Prekopa-Leindler and radial Gaussian-to-sphere projection rather than
    Gaussian/Levy isoperimetry, yielding explicit non-optimal constants
    (e.g. 576 in spherical concentration, 16 in Johnson-Lindenstrauss, and
    8192 * k * log(48/eps) <= eps^2 * log d in Dvoretzky's theorem).
    (6) Blaschke-Santalo is proved via Meyer-Pajor (1990) slice symmetrization
    and strict decrease of the second moment under directional Steiner
    symmetrization, with Urysohn's inequality derived as a corollary.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (Claude Code, review only)"
  notes: >-
    Automated verification enforces zero sorry, zero warnings (--wfail),
    module completeness via convexgeom-audit, exact AxiomAudit.lean matching
    (300 headline declarations), concrete regression checks in
    ConvexGeom/Verification/Checks/, and sandboxed lake comparator statement
    matching against Mathlib-only Challenge.lean with bundled independent
    kernels (nanoda_bin, con-ron, and optional --paranoid all-5-kernel replay).
    Independent statement and code review is performed using Claude Opus 5.5 in
    Claude Code under maintainer Yegor Gorodzha.

