# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
# formalization.yaml (v0.4): repo-root metadata for lean-convex-geometry.

version: "v0.4"

project:
  name: "lean-convex-geometry"
  description: >-
    A Lean 4 and Mathlib library for metric, polyhedral, volumetric, spherical,
    and asymptotic convex geometry in finite-dimensional real inner product
    spaces. Across four layers (Metric, Polytope, Volume, Asymptotic), it
    formalizes classical theorems with 30 headline statements independently
    checked against a Mathlib-only Challenge.lean via lake comparator: Blaschke
    Selection, Bipolar, Supporting Hyperplane, d-simplex volume, Helly (wrapping
    Mathlib), Minkowski-Caratheodory, Jung, Weyl-Minkowski V->H duality,
    Prekopa-Leindler, Brunn-Minkowski, Isodiametric, Rogers-Shephard, Euclidean
    Isoperimetric, Fritz John (general and symmetric, existence and necessary
    decomposition) and the Banach-Mazur compactum, Loomis-Whitney, rank-1
    geometric Brascamp-Lieb and Barthe's reverse Brascamp-Lieb, Ball's volume
    ratio and reverse isoperimetric inequalities, Gaussian and spherical
    Lipschitz concentration, Johnson-Lindenstrauss, Dvoretzky's theorem,
    Blaschke-Santalo (general and symmetric), Dual Urysohn, and Urysohn's
    inequality.
  authors:
    - "Yegor Gorodzha"
  responsible_maintainers:
    - "Yegor Gorodzha"
  license: "Apache-2.0"

classification:
  arxiv:
    - "math.MG"
    - "math.FA"
  msc2020:
    - "52A20"
    - "52A21"
    - "52A23"
    - "52A40"
    - "52B11"
    - "46B07"

sources:
  - title: "An Elementary Introduction to Modern Convex Geometry"
    authors:
      - "Keith Ball"
    id: "https://library.slmath.org/books/Book31/files/ball.pdf"
    type: "book"
    location: "Flavors of Geometry, MSRI Publications Vol. 31 (1997), Lectures 1-9"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Primary blueprint for the Asymptotic layer: Fritz John's theorem and
      decomposition, Dvoretzky-Rogers, Loomis-Whitney, geometric Brascamp-Lieb,
      Ball's volume ratio and reverse isoperimetric inequalities, Gaussian and
      spherical concentration, Johnson-Lindenstrauss, and Dvoretzky's theorem.
  - title: "Convex Bodies: The Brunn-Minkowski Theory (2nd ed.)"
    authors:
      - "Rolf Schneider"
    id: "https://doi.org/10.1017/CBO9781139003858"
    type: "book"
    location: "Chapters 1-3, 7, 9-10"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Reference for support functions, Hormander embedding, Blaschke selection,
      polarity, Steiner point, symmetrization, Brunn-Minkowski, Rogers-Shephard,
      and isoperimetric inequalities.
  - title: "Convex and Discrete Geometry"
    authors:
      - "Peter M. Gruber"
    id: "https://doi.org/10.1007/978-3-540-71133-9"
    type: "book"
    location: "Chapters 1-15"
    relationship: "adapts"
    author_endorsement: "n/a"
    note: >-
      Reference for combinatorial convexity (Radon, Helly, Caratheodory,
      Straszewicz, Jung), polytope faces, and Weyl-Minkowski duality.
  - title: "Asymptotic Geometric Analysis, Part I"
    authors:
      - "Shiri Artstein-Avidan"
      - "Apostolos Giannopoulos"
      - "Vitali D. Milman"
    id: "https://doi.org/10.1090/surv/202"
    type: "book"
    location: "Chapters 1-5"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Reference for Banach-Mazur distances and compactum, ellipsoids, Mahler
      and Santalo volume, mean/Gaussian width, and Urysohn / Dual Urysohn
      inequalities.
  - title: "On a reverse form of the Brascamp-Lieb inequality"
    authors:
      - "Franck Barthe"
    id: "https://doi.org/10.1007/s002220050267"
    type: "article"
    location: "Inventiones Mathematicae 134 (1998), 335-361"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Monotone 1D Gaussian optimal-transport proofs of the rank-1 geometric
      Brascamp-Lieb inequality, Barthe's reverse Brascamp-Lieb inequality, and
      the outer volume-ratio polar bound.
  - title: "On the Blaschke-Santalo inequality"
    authors:
      - "Mathieu Meyer"
      - "Alain Pajor"
    id: "https://doi.org/10.1007/BF01190262"
    type: "article"
    location: "Archiv der Mathematik 55 (1990), 82-93"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Slice-volume and Brunn-Minkowski proof that directional Steiner
      symmetrization does not decrease Santalo Mahler volume, combined with
      second-moment strict decrease and John-position compactness to prove the
      Blaschke-Santalo inequality.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Built directly on Mathlib4 v4.36.0 (ConvexBody, gauge, Hahn-Banach,
      Haar measure, HaarToSphere, InnerProductSpace, Helly/Caratheodory
      primitives).

status:
  scope: >-
    Formalization of four convex geometry layers (Metric, Polytope, Volume,
    Asymptotic; 28 library modules) with zero sorry and zero custom axioms.
    30 classical headline statements are independently stated in Mathlib-only
    terms in Challenge.lean (whose 30 sorry placeholders are deliberate
    Comparator holes) and verified in Solution.lean via lake comparator.
    Known scope limits (reverse Brascamp-Lieb regularity hypotheses, Fritz John
    uniqueness and converse, equality cases) and open directions (e.g.
    Bourgain-Milman reverse Santalo, Milman's M-ellipsoid / QS theorem, mixed
    volumes / Aleksandrov-Fenchel, Sudakov minoration, Grunbaum's inequality)
    are documented in docs/CONVENTIONS.md and docs/ROADMAP.md.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "ConvexGeomChallenge.brunn_minkowski"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "ConvexGeomChallenge.isoperimetric_inequality"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "ConvexGeomChallenge.john_theorem"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
